apiVersion: apps/v1
kind: Deployment
metadata:
  name: modulith
  namespace: shop
  labels:
    app: modulith
spec:
  replicas: 1
  selector:
    matchLabels:
      app: modulith          # le Deployment retrouve ses pods par ce label
  template:
    metadata:
      labels:
        app: modulith        # label porté par chaque pod
    spec:
      containers:
        - name: modulith
          image: demo-modulith-sb4:0.0.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              memory: "768Mi"
